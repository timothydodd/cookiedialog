name: Deploy Documentation to Azure Storage

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docker-docs.yml'
  workflow_dispatch:

env:
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      storage_url: ${{ steps.vars.outputs.storage_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json

    - name: Get commit hash and URLs
      id: vars
      run: |
        echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
        echo "storage_url=https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.z13.web.core.windows.net" >> $GITHUB_OUTPUT

    - name: Install documentation dependencies
      working-directory: ./docs
      run: npm ci

    - name: Build documentation site
      working-directory: ./docs
      run: npm run build

    - name: Upload to Azure Storage
      uses: azure/CLI@v2
      with:
        inlineScript: |
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
            --auth-mode key \
            --destination '$web' \
            --source ./docs/dist \
            --overwrite

  deploy-notification:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Deployment success
      run: |
        echo "✅ Documentation deployed to Azure Storage successfully!"
        echo "📦 Commit: ${{ needs.build-and-deploy.outputs.short_sha }}"
        echo "🌐 Live URL: ${{ needs.build-and-deploy.outputs.storage_url }}"
        echo ""
        echo "📝 Note: If you have Azure CDN configured, changes may take a few minutes to propagate."